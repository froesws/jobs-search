[package]
name = "jobs-search"
version = "0.1.0"
description = "Jobs Search local desktop app"
authors = ["William Froes"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "jobs_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
pdf-extract = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
jsonschema = "0.61"
lopdf = "0.42"
tempfile = "3"
wiremock = "0.6.5"
