[package]
name = "jobs-search"
version = "0.1.0"
description = "Jobs Search local desktop app"
authors = ["William Froes"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "jobs_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
jsonschema = "0.61"
tempfile = "3"
